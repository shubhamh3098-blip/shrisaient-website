    <script>
      // Suppress benign [vite] websocket connection notices in AI Studio preview iframe
      (function() {
        var _realConsole = window.console;
        try {
          Object.defineProperty(window, 'console', {
            get: function() { return _realConsole; },
            set: function(newVal) {
              if (newVal && typeof newVal.error === 'function') {
                var origError = newVal.error;
                newVal.error = function() {
                  var first = arguments[0];
                  var text = typeof first === 'string' ? first : (first && first.message ? first.message : '');
                  if (text.indexOf('[vite]') !== -1 || text.indexOf('websocket') !== -1 || text.indexOf('WebSocket') !== -1) {
                    return;
                  }
                  return origError.apply(this, arguments);
                };
              }
              _realConsole = newVal;
            },
            configurable: true
          });
        } catch (e) {}

        if (window.console && window.console.error) {
          var currErr = window.console.error;
          window.console.error = function() {
            var first = arguments[0];
            var text = typeof first === 'string' ? first : (first && first.message ? first.message : '');
            if (text.indexOf('[vite]') !== -1 || text.indexOf('websocket') !== -1 || text.indexOf('WebSocket') !== -1) {
              return;
            }
            return currErr.apply(this, arguments);
          };
        }

        var _realOnError = null;
        try {
          Object.defineProperty(window, 'onerror', {
            get: function() { return _realOnError; },
            set: function(fn) {
              _realOnError = function(message) {
                var str = String(message || '');
                if (str.indexOf('[vite]') !== -1 || str.indexOf('websocket') !== -1) {
                  return true;
                }
                if (fn) return fn.apply(this, arguments);
              };
            },
            configurable: true
          });
        } catch (e) {}
      })();
    </script>
