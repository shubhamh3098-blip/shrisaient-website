<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient - Full Bleed for Maskable -->
    <radialGradient id="maskBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#142646" />
      <stop offset="60%" stop-color="#0B1528" />
      <stop offset="100%" stop-color="#050A14" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="maskGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9" />
      <stop offset="25%" stop-color="#E5C158" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C1E" />
      <stop offset="100%" stop-color="#F3DC82" />
    </linearGradient>

    <linearGradient id="maskGoldHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA7C1E" />
      <stop offset="50%" stop-color="#FDF4C9" />
      <stop offset="100%" stop-color="#C59B27" />
    </linearGradient>

    <filter id="maskGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Full bleed background for Android maskable safe zone -->
  <rect width="512" height="512" fill="url(#maskBgGrad)" />

  <!-- Inner Safe Zone Content scaled to 80% (center 400x400) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Circular Outer Gold Border -->
    <circle cx="256" cy="256" r="220" fill="none" stroke="url(#maskGoldGrad)" stroke-width="12" />
    <circle cx="256" cy="256" r="208" fill="none" stroke="url(#maskGoldGrad)" stroke-width="3" stroke-opacity="0.75" />

    <!-- Monogram & Tower Group -->
    <g filter="url(#maskGlow)">
      <!-- Beacon -->
      <path d="M256 102 C252 108 250 114 250 120 C250 124 252 127 256 127 C260 127 262 124 262 120 C262 114 260 108 256 102 Z" fill="url(#maskGoldHighlight)" />
      <rect x="246" y="126" width="20" height="5" rx="2" fill="url(#maskGoldGrad)" />
      
      <!-- Tower Legs -->
      <line x1="249" y1="131" x2="236" y2="256" stroke="url(#maskGoldGrad)" stroke-width="5" stroke-linecap="round" />
      <line x1="263" y1="131" x2="276" y2="256" stroke="url(#maskGoldGrad)" stroke-width="5" stroke-linecap="round" />

      <!-- Cross Bracing -->
      <line x1="248" y1="152" x2="264" y2="152" stroke="url(#maskGoldGrad)" stroke-width="3.5" />
      <line x1="248" y1="152" x2="268" y2="182" stroke="url(#maskGoldGrad)" stroke-width="3" />
      <line x1="264" y1="152" x2="244" y2="182" stroke="url(#maskGoldGrad)" stroke-width="3" />
      
      <line x1="244" y1="182" x2="268" y2="182" stroke="url(#maskGoldGrad)" stroke-width="3.5" />
      <line x1="244" y1="182" x2="272" y2="218" stroke="url(#maskGoldGrad)" stroke-width="3" />
      <line x1="268" y1="182" x2="240" y2="218" stroke="url(#maskGoldGrad)" stroke-width="3" />
      
      <line x1="240" y1="218" x2="272" y2="218" stroke="url(#maskGoldGrad)" stroke-width="4" />

      <!-- Horizontal Arms -->
      <line x1="230" y1="152" x2="282" y2="152" stroke="url(#maskGoldGrad)" stroke-width="4.5" stroke-linecap="round" />
      <line x1="222" y1="182" x2="290" y2="182" stroke="url(#maskGoldGrad)" stroke-width="5" stroke-linecap="round" />

      <!-- S Monogram -->
      <path d="M214 140 C175 140 148 162 148 194 C148 238 212 245 220 270 C226 288 210 306 182 306 C158 306 138 290 134 268 L112 272 C118 308 145 330 182 330 C226 330 250 302 250 268 C250 220 182 215 174 190 C168 174 182 160 208 160 C230 160 248 172 252 192 L274 186 C268 156 244 140 214 140 Z" fill="url(#maskGoldHighlight)" />

      <!-- E Monogram -->
      <path d="M272 178 L348 178 L348 200 L298 200 L298 240 L342 240 L342 262 L298 262 L298 304 L352 304 L352 326 L272 326 Z" fill="url(#maskGoldGrad)" />
    </g>

    <!-- Typography -->
    <g text-anchor="middle">
      <text x="256" y="382" font-family="'Cinzel', 'Playfair Display', serif" font-size="34" font-weight="800" fill="url(#maskGoldGrad)" letter-spacing="4">SHRI SAI</text>
      <text x="256" y="416" font-family="'Inter', 'Montserrat', sans-serif" font-size="20" font-weight="700" fill="url(#maskGoldHighlight)" letter-spacing="9">ENTERPRISES</text>
    </g>
  </g>
</svg>
